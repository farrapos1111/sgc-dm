<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Eventos · mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F4F1; font-family: Inter, system-ui, sans-serif; color: #17181A; overflow: hidden">
  <div style="flex: 1; overflow-y: auto; min-height: 0">
    <div style="padding: 16px 16px 0; display: flex; align-items: center; gap: 8px">
      <a href="Main.dc.html" aria-label="Voltar para o início" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: grid; place-items: center; flex: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <h1 style="flex: 1; margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Eventos</h1>
      <button style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 14px; background: {{t.p}}; color: #FFFFFF; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Novo</button>
    </div>

    <div style="margin: 14px 16px 0; background: {{t.p}}; color: #FFFFFF; border-radius: 22px; padding: 18px">
      <span style="display: block; font-size: 14px; opacity: 0.88">Arrecadado no 2º semestre</span>
      <span style="display: block; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px">R$ 18.635,02</span>
      <span style="display: block; font-size: 14px; opacity: 0.88; margin-top: 4px">2 eventos · 269 ingressos vendidos</span>
    </div>

    <div style="margin: 12px 16px 0; background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 14px">
      <span style="width: 48px; height: 48px; border-radius: 14px; background: #F0F0EC; color: #5E6168; display: grid; place-items: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg></span>
      <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600">Nenhum evento aberto</span><span style="display: block; font-size: 13px; color: #5E6168">Crie o próximo para vender ingressos</span></span>
    </div>

    <h2 style="margin: 20px 16px 8px; font-size: 15px; font-weight: 700">Encerrados</h2>
    <div style="margin: 0 16px 20px; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{eventos}}" as="e" hint-placeholder-count="2">
        <a href="M-Evento.dc.html" style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
          <span style="display: flex; gap: 12px; align-items: center">
            <span style="width: 52px; height: 56px; border-radius: 14px; background: {{t.s}}; color: {{t.i}}; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; line-height: 1.1"><span style="font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 20px; font-weight: 800">{{e.dia}}</span><span style="font-size: 12px; font-weight: 700; text-transform: uppercase">{{e.mes}}</span></span>
            <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 16px; font-weight: 700; line-height: 1.3">{{e.nome}}</span><span style="display: block; font-size: 13px; color: #5E6168">{{e.ingressos}} ingressos</span></span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E6168" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
          </span>
          <span style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 700; color: #155A38">{{e.arrec}}</span><span style="color: #5E6168">{{e.pct}}</span></span>
          <span style="height: 8px; border-radius: 999px; background: #EEEEEA; overflow: hidden"><span style="display: block; height: 100%; width: {{e.w}}; background: {{e.barra}}"></span></span>
        </a>
      </sc-for>
    </div>
  </div>
  <dc-import name="TabBar" active="" tema="{{tema}}" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["Bordô","Azul","Verde","Roxo","Grafite"],"default":"Bordô","section":"Identidade"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {'Bordô':{p:'#8A1C2B',s:'#F7E9EB',i:'#6E1622'},'Azul':{p:'#1F4FA3',s:'#E7EEFA',i:'#173E80'},'Verde':{p:'#17694A',s:'#E3F1EA',i:'#10523A'},'Roxo':{p:'#5B2A86',s:'#EFE7F7',i:'#4A2270'},'Grafite':{p:'#2A2E35',s:'#E9EAEC',i:'#2A2E35'}};
    const tema = this.props.tema ?? 'Bordô';
    const t = T[tema] || T['Bordô'];
    return {
      t, tema,
      eventos: [
        { nome:'Aniversário de 9 anos do Farrapos', dia:'19', mes:'set', arrec:'R$ 13.210,02', pct:'Meta batida · 132%', w:'100%', barra:'#1F7A4D', ingressos:177 },
        { nome:'Dia dos Pais', dia:'08', mes:'ago', arrec:'R$ 5.425,00', pct:'90% da meta', w:'90%', barra:t.p, ingressos:92 }
      ]
    };
  }
}
</script>
</body>
</html>
