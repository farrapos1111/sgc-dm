<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Eventos · desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
button{font:inherit;cursor:pointer}
input::placeholder{color:#6B6E75}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4F1; font-family: Inter, system-ui, sans-serif; color: #17181A">
  <div style="flex: 1 1 264px; max-width: 100%; display: flex; flex-direction: column; background: #FFFFFF">
    <dc-import name="Sidebar" active="eventos" tema="{{tema}}" hint-size="264px,1180px"></dc-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 48px; box-sizing: border-box">
    <div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between">
        <div>
          <p style="margin: 0; font-size: 14px; color: #5E6168">Comissão de Eventos</p>
          <h1 style="margin: 2px 0 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.02em">Eventos</h1>
          <p style="margin: 4px 0 0; font-size: 15px; color: #5E6168">Gestão 2026 · 2º semestre</p>
        </div>
        <button style="min-height: 46px; padding: 0 18px; border: 0; border-radius: 12px; background: {{t.p}}; color: #FFFFFF; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Novo evento</button>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
        <div style="background: #FFFFFF; border-radius: 20px; padding: 18px 20px"><span style="display: block; font-size: 13px; color: #5E6168">Arrecadado no semestre</span><span style="display: block; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 26px; font-weight: 800; color: #155A38; margin-top: 4px">R$ 18.635,02</span></div>
        <div style="background: #FFFFFF; border-radius: 20px; padding: 18px 20px"><span style="display: block; font-size: 13px; color: #5E6168">Ingressos vendidos</span><span style="display: block; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 26px; font-weight: 800; margin-top: 4px">269</span></div>
        <div style="background: #FFFFFF; border-radius: 20px; padding: 18px 20px"><span style="display: block; font-size: 13px; color: #5E6168">Próximo evento</span><span style="display: block; font-size: 17px; font-weight: 700; margin-top: 8px">Nenhum marcado</span></div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
        <label style="flex: 1 1 280px; max-width: 440px; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 0 14px; min-height: 44px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6168" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35"></path></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar evento</span>
          <input type="search" placeholder="Buscar por nome ou local" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 15px; background: transparent">
        </label>
        <sc-for list="{{filtros}}" as="f" hint-placeholder-count="3">
          <button onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{f.bd}}; background: {{f.bg}}; color: {{f.fg}}; font-size: 14px; font-weight: 600">{{f.label}}</button>
        </sc-for>
        <span style="flex: 1"></span>
        <button style="min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid #E2E2DE; background: #FFFFFF; font-weight: 600; font-size: 14px; color: #2A2C31">Mais recentes primeiro</button>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px">
        <sc-for list="{{eventos}}" as="e" hint-placeholder-count="2">
          <a href="D-Evento.dc.html" style="background: #FFFFFF; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column">
            <span style="height: 96px; background: {{t.p}}; color: #FFFFFF; padding: 16px 18px; box-sizing: border-box; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px">
              <span style="font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 34px; font-weight: 800; line-height: 1">{{e.dia}}<span style="font-size: 15px; font-weight: 700; margin-left: 6px; text-transform: uppercase">{{e.mes}}</span></span>
              <span style="font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.18); padding: 4px 10px; border-radius: 999px">Encerrado</span>
            </span>
            <span style="padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
              <span><span style="display: block; font-size: 18px; font-weight: 700">{{e.nome}}</span><span style="display: block; font-size: 14px; color: #5E6168; margin-top: 2px">{{e.quando}}</span></span>
              <span style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 700; color: #155A38">{{e.arrec}}</span><span style="color: #5E6168">meta {{e.meta}}</span></span>
              <span style="height: 8px; border-radius: 999px; background: #EEEEEA; overflow: hidden"><span style="display: block; height: 100%; width: {{e.w}}; background: {{e.barra}}"></span></span>
              <span style="display: flex; justify-content: space-between; font-size: 14px; color: #3F4249"><span>{{e.pct}}</span><span>{{e.ingressos}} ingressos</span></span>
            </span>
          </a>
        </sc-for>
        <button style="min-height: 240px; border-radius: 20px; border: 2px dashed #D6D6D1; background: transparent; color: #3F4249; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 600">
          <span style="width: 48px; height: 48px; border-radius: 50%; background: {{t.s}}; color: {{t.p}}; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
          Criar o próximo evento
        </button>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["Bordô","Azul","Verde","Roxo","Grafite"],"default":"Bordô","section":"Identidade"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filtro: 'Todos' }; }
  renderVals() {
    const T = {'Bordô':{p:'#8A1C2B',s:'#F7E9EB',i:'#6E1622'},'Azul':{p:'#1F4FA3',s:'#E7EEFA',i:'#173E80'},'Verde':{p:'#17694A',s:'#E3F1EA',i:'#10523A'},'Roxo':{p:'#5B2A86',s:'#EFE7F7',i:'#4A2270'},'Grafite':{p:'#2A2E35',s:'#E9EAEC',i:'#2A2E35'}};
    const tema = this.props.tema ?? 'Bordô';
    const t = T[tema] || T['Bordô'];
    const f = this.state.filtro;
    const filtros = ['Todos','Abertos','Encerrados'].map((label) => { const on = f === label; return { label, pressed: on ? 'true' : 'false', bg: on ? '#17181A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#2A2C31', bd: on ? '#17181A' : '#DCDCD8', pick: () => this.setState({ filtro: label }) }; });
    const ev = [
      { nome:'Aniversário de 9 anos do Farrapos', dia:'19', mes:'set', quando:'Sábado, 19/09 às 12:00 · Salão do São José', arrec:'R$ 13.210,02', meta:'R$ 10.000,00', pct:'Meta batida · 132%', w:'100%', barra:'#1F7A4D', ingressos:177 },
      { nome:'Dia dos Pais', dia:'08', mes:'ago', quando:'Sábado, 08/08 às 18:30', arrec:'R$ 5.425,00', meta:'R$ 6.000,00', pct:'90% da meta', w:'90%', barra:t.p, ingressos:92 }
    ];
    return { t, tema, filtros, eventos: f === 'Abertos' ? [] : ev };
  }
}
</script>
</body>
</html>
