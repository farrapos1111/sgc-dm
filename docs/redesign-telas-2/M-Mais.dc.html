<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
button{font:inherit;cursor:pointer}
input::placeholder{color:#6B6E75}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F4F1; font-family: Inter, system-ui, sans-serif; color: #17181A; overflow: hidden">
  <div style="flex: 1; overflow-y: auto; min-height: 0">
    <div style="padding: 16px 16px 0; display: flex; align-items: center; gap: 8px">
      <a href="Main.dc.html" aria-label="Voltar para o início" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: grid; place-items: center; flex: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Tudo do capítulo</h1>
    </div>
    <div style="padding: 14px 16px 0">
      <label style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 14px; padding: 0 14px; min-height: 52px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E6168" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar função</span>
        <input type="search" placeholder="O que você procura?" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; background: transparent">
      </label>
    </div>
    <div style="padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{grupos}}" as="g" hint-placeholder-count="6">
        <div style="background: #FFFFFF; border-radius: 20px; padding: 16px">
          <h2 style="margin: 0 0 12px; font-size: 15px; font-weight: 700">{{g.titulo}}</h2>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 6px">
            <sc-for list="{{g.itens}}" as="i" hint-placeholder-count="4">
              <a href="{{i.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; position: relative">
                <span style="width: 52px; height: 52px; border-radius: 16px; background: {{t.s}}; color: {{t.p}}; display: grid; place-items: center">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg>
                </span>
                <sc-if value="{{i.badge}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: -4px; right: 6px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #B42318; color: #FFFFFF; font-size: 11px; font-weight: 700; display: grid; place-items: center; border: 2px solid #FFFFFF">{{i.badge}}</span></sc-if>
                <span style="font-size: 12px; font-weight: 500; line-height: 1.2; color: #2A2C31">{{i.label}}</span>
              </a>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
  <dc-import name="TabBar" active="" tema="{{tema}}" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
