<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Menu lateral</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<aside style="width: 100%; min-height: 1180px; height: 100%; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E8E8E4; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; color: #17181A; padding: 20px 14px">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
    <span style="width: 40px; height: 40px; border-radius: 12px; background: {{t.p}}; color: #FFFFFF; display: grid; place-items: center; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 800; font-size: 17px">F</span>
    <span style="line-height: 1.2"><span style="display: block; font-size: 12px; color: #5E6168; font-weight: 500">Templo Virtual</span><span style="display: block; font-size: 15px; font-weight: 700">Farrapos nº 1111</span></span>
  </div>
  <button style="margin-top: 16px; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid #E2E2DE; border-radius: 12px; background: #FAFAF8; font-size: 14px; color: #2A2C31; text-align: left">
    <span style="flex: 1">Capítulo · Caxias do Sul</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"></path></svg>
  </button>

  <nav aria-label="Menu principal" style="margin-top: 18px; display: flex; flex-direction: column; gap: 14px; flex: 1">
    <sc-for list="{{grupos}}" as="g" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <sc-if value="{{g.titulo}}" hint-placeholder-val="{{true}}">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6E75; padding: 0 12px 6px">{{g.titulo}}</span>
        </sc-if>
        <sc-for list="{{g.itens}}" as="i" hint-placeholder-count="4">
          <a href="{{i.href}}" aria-current="{{i.cur}}" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 10px; background: {{i.bg}}; color: {{i.fg}}; font-size: 15px; font-weight: {{i.w}}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg>
            <span style="flex: 1">{{i.label}}</span>
            <sc-if value="{{i.badge}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 700; background: #FDF3D8; color: #7A4F00; padding: 2px 8px; border-radius: 999px">{{i.badge}}</span></sc-if>
          </a>
        </sc-for>
      </div>
    </sc-for>
  </nav>

  <div style="border-top: 1px solid #EEEEEA; padding-top: 14px; margin-top: 14px; display: flex; align-items: center; gap: 10px">
    <span style="width: 40px; height: 40px; border-radius: 50%; background: {{t.s}}; color: {{t.i}}; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none">LB</span>
    <span style="flex: 1; min-width: 0; line-height: 1.25"><span style="display: block; font-size: 14px; font-weight: 600">Lucas Boeira Borges</span><span style="display: block; font-size: 12px; color: #5E6168">Conselheiro Consultor</span></span>
    <button aria-label="Tema escuro" style="width: 40px; height: 40px; border-radius: 10px; border: 0; background: #F4F4F1; display: grid; place-items: center; color: #3F4249">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
    </button>
    <button aria-label="Sair" style="width: 40px; height: 40px; border-radius: 10px; border: 0; background: #F4F4F1; display: grid; place-items: center; color: #3F4249">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
    </button>
  </div>
</aside>
</x-dc>
