<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Perfil · mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F4F1; font-family: Inter, system-ui, sans-serif; color: #17181A; overflow: hidden">
  <div style="flex: 1; overflow-y: auto; min-height: 0">
    <div style="padding: 20px 16px 4px; display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Meu perfil</h1>
      <button aria-label="Configurações" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #FFFFFF; display: grid; place-items: center; color: #17181A">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      </button>
    </div>

    <div style="margin: 14px 16px 0; border-radius: 22px; background: {{t.p}}; color: #FFFFFF; padding: 20px; position: relative; overflow: hidden; min-height: 196px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
      <div aria-hidden="true" style="position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; border: 28px solid rgba(255,255,255,0.08)"></div>
      <div style="display: flex; justify-content: space-between; align-items: flex-start; position: relative">
        <div>
          <span style="display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85">Carteirinha digital</span>
          <span style="display: block; font-size: 14px; margin-top: 2px; opacity: 0.92">Capítulo Farrapos nº 1111</span>
        </div>
        <span style="font-size: 12px; font-weight: 700; background: #FFFFFF; color: #155A38; padding: 4px 10px; border-radius: 999px">Regular</span>
      </div>
      <div style="position: relative">
        <span style="display: block; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.01em">Lucas Boeira Borges</span>
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 6px">
          <span style="font-size: 14px; opacity: 0.92">Senior DeMolay · ID 136087</span>
          <button style="min-height: 40px; padding: 0 12px; border-radius: 12px; border: 0; background: rgba(255,255,255,0.16); color: #FFFFFF; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 14v.01M14 20v.01M20 20h-3"></path></svg>Mostrar QR
          </button>
        </div>
      </div>
    </div>

    <div role="tablist" aria-label="Seções do perfil" style="margin: 16px 16px 0; background: #E9E9E5; border-radius: 14px; padding: 4px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{abas}}" as="a" hint-placeholder-count="4">
        <button role="tab" aria-selected="{{a.sel}}" onClick="{{a.pick}}" style="min-height: 40px; border: 0; border-radius: 10px; background: {{a.bg}}; color: {{a.fg}}; font-weight: 600; font-size: 13px; box-shadow: {{a.sh}}">{{a.label}}</button>
      </sc-for>
    </div>

    <h2 style="margin: 22px 16px 8px; font-size: 15px; font-weight: 700">Minha trajetória</h2>
    <div style="margin: 0 16px; background: #FFFFFF; border-radius: 20px; padding: 8px 16px">
      <sc-for list="{{trajetoria}}" as="e" hint-placeholder-count="5">
        <div style="display: flex; gap: 14px; padding: 10px 0">
          <div style="display: flex; flex-direction: column; align-items: center; width: 14px">
            <span style="width: 12px; height: 12px; border-radius: 50%; background: {{e.dot}}; margin-top: 4px; flex: none"></span>
            <span style="flex: 1; width: 2px; background: #ECECE8; margin-top: 4px"></span>
          </div>
          <div style="flex: 1; display: flex; justify-content: space-between; gap: 8px">
            <span style="font-size: 15px; font-weight: 600">{{e.label}}</span>
            <span style="font-size: 14px; color: #5E6168; font-variant-numeric: tabular-nums">{{e.data}}</span>
          </div>
        </div>
      </sc-for>
      <p style="margin: 4px 0 8px; font-size: 13px; color: #5E6168; display: flex; gap: 6px; align-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"></path></svg>Datas alteradas só pela secretaria</p>
    </div>

    <h2 style="margin: 22px 16px 8px; font-size: 15px; font-weight: 700">Meus dados</h2>
    <div style="margin: 0 16px; background: #FFFFFF; border-radius: 20px; overflow: hidden">
      <sc-for list="{{dados}}" as="d" hint-placeholder-count="4">
        <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 0; border-bottom: 1px solid #F0F0EC; background: #FFFFFF; text-align: left; color: #17181A; min-height: 64px">
          <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 13px; color: #5E6168">{{d.label}}</span><span style="display: block; font-size: 16px; font-weight: 500; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.valor}}</span></span>
          <span style="font-size: 14px; font-weight: 600; color: {{t.p}}">Editar</span>
        </button>
      </sc-for>
    </div>

    <div style="margin: 16px 16px 20px; background: #FFFFFF; border-radius: 20px; overflow: hidden">
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 56px; border: 0; border-bottom: 1px solid #F0F0EC; background: #FFFFFF; font-size: 16px; color: #17181A; text-align: left">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg><span style="flex: 1">Assinatura digital</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E6168" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 56px; border: 0; background: #FFFFFF; font-size: 16px; color: #B42318; text-align: left">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg><span style="flex: 1">Sair da conta</span>
      </button>
    </div>
  </div>
  <dc-import name="TabBar" active="perfil" tema="{{tema}}" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["Bordô","Azul","Verde","Roxo","Grafite"],"default":"Bordô","section":"Identidade"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { aba: 'Dados' }; }
  renderVals() {
    const T = {'Bordô':{p:'#8A1C2B',s:'#F7E9EB',i:'#6E1622'},'Azul':{p:'#1F4FA3',s:'#E7EEFA',i:'#173E80'},'Verde':{p:'#17694A',s:'#E3F1EA',i:'#10523A'},'Roxo':{p:'#5B2A86',s:'#EFE7F7',i:'#4A2270'},'Grafite':{p:'#2A2E35',s:'#E9EAEC',i:'#2A2E35'}};
    const tema = this.props.tema ?? 'Bordô';
    const t = T[tema] || T['Bordô'];
    const abas = ['Dados','Frequência','Cobranças','Histórico'].map((label) => {
      const on = this.state.aba === label;
      return { label, sel: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#17181A' : '#4A4D54',
        sh: on ? '0 1px 3px rgba(20,20,20,0.12)' : 'none', pick: () => this.setState({ aba: label }) };
    });
    return {
      t, tema, abas,
      trajetoria: [
        {label:'Nascimento', data:'11/06/2003', dot:'#CFCFCA'},
        {label:'Iniciação', data:'11/05/2024', dot:t.p},
        {label:'Exame Grau Iniciático', data:'11/05/2024', dot:t.p},
        {label:'Elevação Grau DeMolay', data:'08/06/2024', dot:t.p},
        {label:'Exame Grau DeMolay', data:'08/06/2024', dot:t.p}
      ],
      dados: [
        {label:'Telefone', valor:'(54) 8410-1106'},
        {label:'E-mail', valor:'lucasboeiraborges@gmail.com'},
        {label:'Endereço', valor:'Rua César Stalivieri, 150 · Panazzolo'},
        {label:'Documentos', valor:'CPF e RG cadastrados'}
      ]
    };
  }
}
</script>
</body>
</html>
