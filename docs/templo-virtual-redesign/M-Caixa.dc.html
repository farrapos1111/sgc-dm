<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caixa · mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F4F1; font-family: Inter, system-ui, sans-serif; color: #17181A; overflow: hidden">
  <div style="flex: 1; overflow-y: auto; min-height: 0">
    <div style="background: {{t.p}}; color: #FFFFFF; padding: 16px 20px 24px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <a href="Main.dc.html" aria-label="Voltar para o início" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.14); display: grid; place-items: center; color: #FFFFFF">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
        </a>
        <span style="font-weight: 600; font-size: 16px">Caixa do capítulo</span>
        <button aria-label="{{eyeLabel}}" onClick="{{toggle}}" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.14); color: #FFFFFF; display: grid; place-items: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{eyeIcon}}"></path></svg>
        </button>
      </div>
      <p style="margin: 22px 0 0; font-size: 14px; opacity: 0.88">Saldo atual</p>
      <p style="margin: 2px 0 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 36px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{saldo}}</p>
      <p style="margin: 6px 0 0; font-size: 14px; opacity: 0.88">Inclui {{restante}} vindos de 2025</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 18px 16px 4px">
      <sc-for list="{{acoes}}" as="a" hint-placeholder-count="4">
        <button style="display: flex; flex-direction: column; align-items: center; gap: 8px; border: 0; background: none; color: #2A2C31; padding: 0">
          <span style="width: 56px; height: 56px; border-radius: 50%; background: {{a.bg}}; color: {{a.fg}}; display: grid; place-items: center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"></path></svg>
          </span>
          <span style="font-size: 13px; font-weight: 500; line-height: 1.2; text-align: center">{{a.label}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; gap: 8px; padding: 16px 16px 0; overflow-x: auto">
      <sc-for list="{{meses}}" as="m" hint-placeholder-count="4">
        <button onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" style="flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid {{m.border}}; background: {{m.bg}}; color: {{m.fg}}; font-weight: 600; font-size: 14px">{{m.label}}</button>
      </sc-for>
    </div>

    <div style="margin: 12px 16px 0; background: #FFFFFF; border-radius: 20px; padding: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div><span style="display: block; font-size: 13px; color: #5E6168">Entrou em novembro</span><span style="display: block; font-size: 18px; font-weight: 700; color: #155A38; margin-top: 2px">{{entradas}}</span></div>
      <div><span style="display: block; font-size: 13px; color: #5E6168">Saiu em novembro</span><span style="display: block; font-size: 18px; font-weight: 700; color: #A1261B; margin-top: 2px">{{saidas}}</span></div>
      <div style="grid-column: 1 / -1; border-top: 1px solid #F0F0EC; padding-top: 10px; display: flex; justify-content: space-between; font-size: 14px"><span style="color: #5E6168">Resultado do mês</span><span style="font-weight: 700; color: #A1261B">{{resultado}}</span></div>
    </div>

    <sc-for list="{{dias}}" as="d" hint-placeholder-count="3">
      <p style="margin: 20px 16px 8px; font-size: 13px; font-weight: 600; color: #5E6168">{{d.dia}}</p>
      <div style="margin: 0 16px; background: #FFFFFF; border-radius: 20px; overflow: hidden">
        <sc-for list="{{d.itens}}" as="l" hint-placeholder-count="3">
          <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-bottom: 1px solid #F0F0EC; background: #FFFFFF; text-align: left; color: #17181A; min-height: 64px">
            <span style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: {{l.ibg}}; color: {{l.ifg}}; display: grid; place-items: center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{l.icon}}"></path></svg>
            </span>
            <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.desc}}</span><span style="display: block; font-size: 13px; color: #5E6168">{{l.cat}}</span></span>
            <span style="font-size: 15px; font-weight: 700; color: {{l.vfg}}; white-space: nowrap; font-variant-numeric: tabular-nums">{{l.valor}}</span>
          </button>
        </sc-for>
      </div>
    </sc-for>
    <div style="height: 20px"></div>
  </div>
  <dc-import name="TabBar" active="caixa" tema="{{tema}}" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["Bordô","Azul","Verde","Roxo","Grafite"],"default":"Bordô","section":"Identidade"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { oculto: false, mes: 'Novembro' }; }
  renderVals() {
    const T = {'Bordô':{p:'#8A1C2B',s:'#F7E9EB',i:'#6E1622'},'Azul':{p:'#1F4FA3',s:'#E7EEFA',i:'#173E80'},'Verde':{p:'#17694A',s:'#E3F1EA',i:'#10523A'},'Roxo':{p:'#5B2A86',s:'#EFE7F7',i:'#4A2270'},'Grafite':{p:'#2A2E35',s:'#E9EAEC',i:'#2A2E35'}};
    const tema = this.props.tema ?? 'Bordô';
    const t = T[tema] || T['Bordô'];
    const o = this.state.oculto;
    const h = (v) => o ? 'R$ ••••' : v;
    const IN = 'M17 7 7 17M17 17H7V7', OUT = 'M7 17 17 7M7 7h10v10';
    const ent = (desc, cat, v) => ({desc, cat, valor: o ? '••••' : '+ ' + v, icon: IN, ibg: '#EAF5EF', ifg: '#155A38', vfg: '#155A38'});
    const sai = (desc, cat, v) => ({desc, cat, valor: o ? '••••' : '- ' + v, icon: OUT, ibg: '#FBEDEC', ifg: '#A1261B', vfg: '#17181A'});
    const meses = ['Novembro','Outubro','Setembro','Agosto'].map((label) => {
      const on = this.state.mes === label;
      return { label, pressed: on ? 'true' : 'false', bg: on ? '#17181A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#2A2C31', border: on ? '#17181A' : '#DCDCD8', pick: () => this.setState({ mes: label }) };
    });
    return {
      t, tema, meses,
      toggle: () => this.setState({ oculto: !o }),
      eyeIcon: o ? 'M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A9.8 9.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6' : 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
      eyeLabel: o ? 'Mostrar valores' : 'Ocultar valores',
      saldo: h('R$ 12.701,00'), restante: h('R$ 11.413,41'), entradas: h('R$ 584,70'), saidas: h('R$ 1.182,13'), resultado: h('-R$ 597,43'),
      acoes: [
        {label:'Novo lança­mento', icon:'M12 5v14M5 12h14', bg:t.p, fg:'#FFFFFF'},
        {label:'Exportar', icon:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3', bg:'#FFFFFF', fg:t.p},
        {label:'Compar­tilhar', icon:'M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7', bg:'#FFFFFF', fg:t.p},
        {label:'Importar', icon:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12', bg:'#FFFFFF', fg:t.p}
      ],
      dias: [
        {dia:'Sábado, 7 de novembro', itens:[
          ent('Taxa de iniciação · Guilherme Marzotto','SCDB / GCE','R$ 120,00'),
          ent('Elevação · Guilherme Marzotto','SCDB / GCE','R$ 100,00'),
          ent('Mensalidades nov e out · Guilherme Marzotto','Mensalidades','R$ 40,00'),
          ent('Transporte e ingresso CGOD · Elias Ferreira','Congresso · 1 de 3','R$ 135,00')
        ]},
        {dia:'Sexta, 6 de novembro', itens:[
          ent('Mensalidade nov · Ariam Lumertz dos Reis','Mensalidades','R$ 20,00'),
          ent('Mensalidades nov e dez · Gabriel Roldo','Mensalidades','R$ 40,00')
        ]},
        {dia:'Quarta, 4 de novembro', itens:[
          sai('Pacote de iniciação e taxa administrativa','SCDB / GCE','R$ 270,00')
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
