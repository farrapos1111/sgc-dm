<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Templo Virtual</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: #f4f4f1;
        color: #17181a;
        font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #121316; color: #f2f2ef; }
      }
      .box { display: flex; flex-direction: column; align-items: center; gap: 16px; }
      img { width: 72px; height: 72px; }
      .bar { width: 120px; height: 4px; border-radius: 999px; background: rgba(127,127,127,.25); overflow: hidden; }
      .bar::after {
        content: ""; display: block; width: 40%; height: 100%; border-radius: inherit; background: #9e1b32;
        animation: slide 1.1s cubic-bezier(.22,1,.36,1) infinite;
      }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; } }
    </style>
  </head>
  <body>
    <div class="box" role="status" aria-label="Carregando o Templo Virtual">
      <img src="logo.svg" alt="" />
      <div class="bar"></div>
    </div>
  </body>
</html>
